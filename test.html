<!DOCTYPE html>

<meta charset="UTF-8">
<title>Masonry Grid Simple</title>
    <link href="css/style.css" media="all" rel="stylesheet" type="text/css">

<style>
/* Basic styling for the grid layout */
.photo-grid-container {
    display: grid;
    /* Sets up 3 columns of equal width */
    grid-template-columns: repeat(3, 1fr); 
    gap: 16px; /* Spacing between grid items */
    max-width: 1200px; 
    margin: 0 auto; 
    padding: 20px;
    font-family: Arial, sans-serif;
}

.grid-item {
    position: relative;
    overflow: hidden;
    /* --- KEY CHANGE HERE: Enforces a 3:4 portrait rectangle aspect ratio (width / height) --- */
    aspect-ratio: 3 / 5; 
    /* The fixed height is removed for responsive aspect ratio control */
}

.grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures images fill the rectangle without stretching */
    display: block;
}

/* Style for the photographer watermark text (unchanged) */
.photographer-stamp {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: white;
    font-size: 10px;
    padding: 3px 5px;
    background: rgba(0, 0, 0, 0.4); 
    opacity: 0.8;
}

/* Media queries for smaller screens (unchanged) */
@media (max-width: 768px) {
    .photo-grid-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    .photo-grid-container {
        grid-template-columns: 1fr;
    }
}

</style>
</head>
